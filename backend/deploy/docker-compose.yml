version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: familia_db
    environment:
      POSTGRES_USER: familia_app
      POSTGRES_PASSWORD: change_me_strong
      POSTGRES_DB: familia
    command: ["postgres", "-c", "password_encryption=scram-sha-256"]
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familia_app -d familia"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: familia_backend
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: familia_nginx
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_challenges:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    restart: unless-stopped

  certbot:
    image: certbot/certbot:v2.11.0
    container_name: familia_certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_challenges:/var/www/certbot
    entrypoint: /bin/sh
    command: -c "sleep infinity"

volumes:
  db_data:
  letsencrypt:
  certbot_challenges:
