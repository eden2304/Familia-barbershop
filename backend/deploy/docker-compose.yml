version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: familia_db
    environment:
      POSTGRES_USER: familia
      POSTGRES_PASSWORD: familia
      POSTGRES_DB: familia
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familia -d familia"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: familia_backend
    environment:
      NODE_ENV: production
      PORT: 3001
      # שים לב ל-DB: ב-Compose, השם של השירות הוא hostname
      DATABASE_URL: postgres://familia:familia@db:5432/familia
      ADMIN_PHONES: "0537002171,0523767851"
      SEED: "false"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: familia_nginx
    depends_on:
      - backend
    ports:
      - "80:80"
      # נפתח 443 בהמשך כשנוסיף SSL
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_challenges:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    restart: unless-stopped

  # נריץ certbot ידנית בשלבים כדי להשיג תעודה (ראה הוראות בהמשך)
  certbot:
    image: certbot/certbot:v2.11.0
    container_name: familia_certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_challenges:/var/www/certbot
    entrypoint: /bin/sh
    command: -c "sleep infinity"

volumes:
  db_data:
  letsencrypt:
  certbot_challenges:
