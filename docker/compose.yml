version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: familia_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: familia
      POSTGRES_PASSWORD: familia
      POSTGRES_DB: familia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: familia_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8081:80"

volumes:
  pgdata:
